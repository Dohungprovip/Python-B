<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Todo Demo</title>
</head>
<body>
  <h1>Danh sách việc cần làm</h1>
  <input id="task" type="text" placeholder="Nhập công việc">
  <button id="add">Thêm</button>
  <p id="error" style="color:red"></p>
  <ul id="list"></ul>
  <p>Số việc: <span id="count">0</span></p>
  <script>
    const input = document.getElementById("task");
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const error = document.getElementById("error");
    document.getElementById("add").addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) { error.textContent = "Không được để trống"; return; }
      error.textContent = "";
      const li = document.createElement("li");
      li.textContent = text;
      const del = document.createElement("button");
      del.textContent = "Xoá";
      del.className = "delete";
      del.addEventListener("click", () => { li.remove(); count.textContent = list.children.length; });
      li.appendChild(del);
      list.appendChild(li);
      count.textContent = list.children.length;
      input.value = "";
    });
  </script>
</body>
</html>
