[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: kiểm thử đơn vị (nhanh, không cần server)
    data: kiểm thử dữ liệu thật trong tsq_data (đọc bản sao, chỉ đọc)
    api: kiểm thử API qua TestClient (khởi động app với DB tạm)
    e2e: kiểm thử giao diện bằng Selenium (cần Chrome, tự bật server)
